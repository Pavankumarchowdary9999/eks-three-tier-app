name: Build Test and Push

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: "698387659728"

  FRONTEND_IMAGE: 698387659728.dkr.ecr.ap-south-1.amazonaws.com/frontend
  BACKEND_IMAGE: 698387659728.dkr.ecr.ap-south-1.amazonaws.com/backend

jobs:

  # =====================================================
  # BACKEND CI
  # =====================================================

  backend-build:
    name: Build and Test Spring Boot
    runs-on: ubuntu-latest

    steps:

      - name: Checkout application
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Java
        run: |
          java -version
          mvn -version

      - name: Build and test backend
        working-directory: backend
        run: |
          mvn clean test

      - name: Package Spring Boot application
        working-directory: backend
        run: |
          mvn package -DskipTests

      - name: Verify JAR
        working-directory: backend
        run: |
          ls -lh target/
          test -f target/app-0.0.1-SNAPSHOT.jar


  # =====================================================
  # FRONTEND VALIDATION
  # =====================================================

  frontend-build:
    name: Validate Frontend
    runs-on: ubuntu-latest

    steps:

      - name: Checkout application
        uses: actions/checkout@v4

      - name: Validate frontend files
        run: |
          test -f frontend/index.html
          test -f frontend/style.css
          test -f frontend/app.js
          test -f frontend/nginx.conf
          test -f frontend/Dockerfile

          echo "Frontend files validated successfully"


  # =====================================================
  # DOCKER BUILD AND ECR PUSH
  # =====================================================

  docker-build-push:
    name: Build Docker Images and Push to ECR
    runs-on: ubuntu-latest

    needs:
      - backend-build
      - frontend-build

    steps:

      - name: Checkout application
        uses: actions/checkout@v4

      # -------------------------------------------------
      # AWS
      # -------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::698387659728:role/GitHubActionsECRRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # -------------------------------------------------
      # ECR LOGIN
      # -------------------------------------------------

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # -------------------------------------------------
      # IMAGE TAG
      # -------------------------------------------------

      - name: Set image tag
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA}" >> "$GITHUB_ENV"

      # -------------------------------------------------
      # BUILD BACKEND DOCKER IMAGE
      # -------------------------------------------------

      - name: Build backend Docker image
        run: |
          docker build \
            -t $BACKEND_IMAGE:$IMAGE_TAG \
            ./backend

      # -------------------------------------------------
      # BUILD FRONTEND DOCKER IMAGE
      # -------------------------------------------------

      - name: Build frontend Docker image
        run: |
          docker build \
            -t $FRONTEND_IMAGE:$IMAGE_TAG \
            ./frontend

      # -------------------------------------------------
      # PUSH BACKEND
      # -------------------------------------------------

      - name: Push backend image to ECR
        run: |
          docker push $BACKEND_IMAGE:$IMAGE_TAG

      # -------------------------------------------------
      # PUSH FRONTEND
      # -------------------------------------------------

      - name: Push frontend image to ECR
        run: |
          docker push $FRONTEND_IMAGE:$IMAGE_TAG

      # -------------------------------------------------
      # SHOW RESULT
      # -------------------------------------------------

      - name: Display image information
        run: |
          echo "======================================"
          echo "Backend image:"
          echo "$BACKEND_IMAGE:$IMAGE_TAG"
          echo ""
          echo "Frontend image:"
          echo "$FRONTEND_IMAGE:$IMAGE_TAG"
          echo "======================================"
