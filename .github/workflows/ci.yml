name: Build Test and Push

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: "698387659728"

  FRONTEND_IMAGE: 698387659728.dkr.ecr.ap-south-1.amazonaws.com/frontend
  BACKEND_IMAGE: 698387659728.dkr.ecr.ap-south-1.amazonaws.com/backend

jobs:

  # =====================================================
  # BACKEND CI
  # =====================================================

  backend-build:
    name: Build and Test Spring Boot
    runs-on: ubuntu-latest

    steps:

      - name: Checkout application
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Java
        run: |
          java -version
          mvn -version

      - name: Build and test backend
        working-directory: backend
        run: |
          mvn clean test

      - name: Package Spring Boot application
        working-directory: backend
        run: |
          mvn package -DskipTests

      - name: Verify JAR
        working-directory: backend
        run: |
          ls -lh target/
          test -f target/app-0.0.1-SNAPSHOT.jar


  # =====================================================
  # FRONTEND VALIDATION
  # =====================================================

  frontend-build:
    name: Validate Frontend
    runs-on: ubuntu-latest

    steps:

      - name: Checkout application
        uses: actions/checkout@v4

      - name: Validate frontend files
        run: |
          test -f frontend/index.html
          test -f frontend/style.css
          test -f frontend/app.js
          test -f frontend/nginx.conf
          test -f frontend/Dockerfile

          echo "Frontend files validated successfully"


  # =====================================================
  # DOCKER BUILD AND ECR PUSH
  # =====================================================

  docker-build-push:
    name: Build Docker Images and Push to ECR
    runs-on: ubuntu-latest

    needs:
      - backend-build
      - frontend-build

    steps:

      - name: Checkout application
        uses: actions/checkout@v4

      # -------------------------------------------------
      # AWS
      # -------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::698387659728:role/GitHubActionsECRRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # -------------------------------------------------
      # ECR LOGIN
      # -------------------------------------------------

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # -------------------------------------------------
      # IMAGE TAG
      # -------------------------------------------------

      - name: Set image tag
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA}" >> "$GITHUB_ENV"

      # -------------------------------------------------
      # BUILD BACKEND DOCKER IMAGE
      # -------------------------------------------------

      - name: Build backend Docker image
        run: |
          docker build \
            -t $BACKEND_IMAGE:$IMAGE_TAG \
            ./backend

      # -------------------------------------------------
      # BUILD FRONTEND DOCKER IMAGE
      # -------------------------------------------------

      - name: Build frontend Docker image
        run: |
          docker build \
            -t $FRONTEND_IMAGE:$IMAGE_TAG \
            ./frontend

      # -------------------------------------------------
      # PUSH BACKEND
      # -------------------------------------------------

      - name: Push backend image to ECR
        run: |
          docker push $BACKEND_IMAGE:$IMAGE_TAG

      # -------------------------------------------------
      # PUSH FRONTEND
      # -------------------------------------------------

      - name: Push frontend image to ECR
        run: |
          docker push $FRONTEND_IMAGE:$IMAGE_TAG

      # -------------------------------------------------
      # SHOW RESULT
      # -------------------------------------------------

      - name: Display image information
        run: |
          echo "======================================"
          echo "Backend image:"
          echo "$BACKEND_IMAGE:$IMAGE_TAG"
          echo ""
          echo "Frontend image:"
          echo "$FRONTEND_IMAGE:$IMAGE_TAG"
          echo "======================================"
         # =====================================================
  # UPDATE GITOPS REPOSITORY
  # =====================================================

  update-gitops:
    name: Update GitOps Helm Values
    runs-on: ubuntu-latest

    needs:
      - docker-build-push

    permissions:
      contents: read

    steps:

      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: Pavankumarchowdary9999/eks-three-tier-gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Update Helm image tags
        working-directory: gitops
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os

          file = Path("helm/three-tier-app/values.yaml")

          content = file.read_text()

          image_tag = os.environ["IMAGE_TAG"]

          content = content.replace(
              'repository: 698387659728.dkr.ecr.ap-south-1.amazonaws.com/frontend',
              'repository: 698387659728.dkr.ecr.ap-south-1.amazonaws.com/frontend'
          )

          content = content.replace(
              'repository: 698387659728.dkr.ecr.ap-south-1.amazonaws.com/backend',
              'repository: 698387659728.dkr.ecr.ap-south-1.amazonaws.com/backend'
          )

          lines = content.splitlines()

          current_image = None

          for i, line in enumerate(lines):

              stripped = line.strip()

              if stripped == "frontend:":
                  current_image = "frontend"

              elif stripped == "backend:":
                  current_image = "backend"

              elif current_image in ["frontend", "backend"] and stripped.startswith("tag:"):
                  lines[i] = f'    tag: "{image_tag}"'
                  current_image = None

          file.write_text("\n".join(lines) + "\n")
          PY

      - name: Show GitOps changes
        working-directory: gitops
        run: |
          git diff -- helm/three-tier-app/values.yaml

      - name: Commit GitOps change
        working-directory: gitops
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add helm/three-tier-app/values.yaml

          git commit \
            -m "Update application images to ${GITHUB_SHA}" \
            || echo "No changes to commit"

          git push
